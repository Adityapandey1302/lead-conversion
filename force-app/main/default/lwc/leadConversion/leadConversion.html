<template>
    <div class="responsive-header">
        Convert Lead
    </div><br/>

    <!-- NEW - Shown when the initial getLeadData load failed (e.g. Lead
         already converted). Prevents the form from sitting blank/stuck. -->
    <template if:true={loadError}>
        <div class="slds-p-around_medium">
            <div class="slds-box slds-theme_error slds-m-vertical_small">
                <div class="slds-text-align_center slds-p-around_small">
                    <lightning-icon icon-name="utility:error" size="small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                    <strong>Unable to Load Lead</strong>
                    <p class="slds-m-top_x-small">{loadError}</p>
                </div>
            </div>
        </div>
    </template>

    <template if:false={loadError}>
        <template if:false={converted}>
            <div class="slds-p-around_medium">
                <!-- Account Section - Only show if creating new account -->
                <template if:true={shouldShowAccountSection}>
                    <div class="slds-grid slds-wrap slds-p-vertical_small">
                        <div class="slds-col slds-size_1-of-1 slds-p-bottom_x-small">
                            <div class="slds-grid slds-align-middle" onclick={openAcc}>
                                <lightning-icon icon-name="utility:chevronright" if:false={openAccount} size="x-small"
                                    class="slds-m-right_x-small"></lightning-icon>
                                <lightning-icon icon-name="utility:chevrondown" if:true={openAccount} size="x-small"
                                    class="slds-m-right_x-small"></lightning-icon>
                                <span>Account</span>
                            </div>
                            <div class="slds-box slds-theme_shade slds-m-top_x-small" if:true={openAccount}>
                                <label class="slds-form-element__label" for="accountName">Account Name <span class="slds-text-color_error">*</span></label>
                                <lightning-input 
                                    type="text" 
                                    value={accName} 
                                    onchange={handleAcc} 
                                    name="accountName"
                                    placeholder="Type here..." 
                                    variant="label-hidden" 
                                    class="slds-m-top_x-small"
                                    disabled={isConverting}>
                                </lightning-input>
                            </div>
                        </div>
                    </div>

                    <!-- Contact Section - Only show if creating new account -->
                    <div class="slds-grid slds-wrap slds-p-vertical_small">
                        <div class="slds-col slds-size_1-of-1 slds-p-bottom_x-small">
                            <div class="slds-grid slds-align-middle" onclick={openCon}>
                                <lightning-icon icon-name="utility:chevronright" if:false={openContact} size="x-small"
                                    class="slds-m-right_x-small"></lightning-icon>
                                <lightning-icon icon-name="utility:chevrondown" if:true={openContact} size="x-small"
                                    class="slds-m-right_x-small"></lightning-icon>
                                <span>Contact</span>
                            </div>
                            <div class="slds-box slds-theme_shade slds-m-top_x-small" if:true={openContact}>
                                <label class="slds-form-element__label" for="contactName">Contact Name <span class="slds-text-color_error">*</span></label>
                                <lightning-input 
                                    type="text" 
                                    value={conName} 
                                    onchange={handleCon} 
                                    name="contactName"
                                    placeholder="Type here..." 
                                    variant="label-hidden" 
                                    class="slds-m-top_x-small"
                                    disabled={isConverting}>
                                </lightning-input>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Message when using existing account -->
                <template if:false={shouldShowAccountSection}>
                    <div class="slds-box slds-theme_info slds-m-vertical_small">
                        <div class="slds-text-align_center slds-p-around_small">
                            <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                            <strong>Using Existing Account</strong>
                            <p class="slds-m-top_x-small">This lead is associated with an existing account. A new Contact will be created against that Account; no new Account will be created.</p>
                        </div>
                    </div>
                </template>

                <!-- COMMENTED OUT - Sample Request / Quote Section - Not creating Quote/Sample anymore -->
                <!-- 
                <template if:false={isAssignedToDealer}>
                    <div class="slds-grid slds-wrap slds-p-vertical_small">
                        <div class="slds-col slds-size_1-of-1 slds-p-bottom_x-small">
                            <div class="slds-grid slds-align-middle" onclick={openRec}>
                                <lightning-icon icon-name="utility:chevronright" if:false={openRecord} size="x-small"
                                    class="slds-m-right_x-small"></lightning-icon>
                                <lightning-icon icon-name="utility:chevrondown" if:true={openRecord} size="x-small"
                                    class="slds-m-right_x-small"></lightning-icon>
                                <span>{recordTypeLabel}</span>
                            </div>
                            <div class="slds-box slds-theme_shade slds-m-top_x-small" if:true={openRecord}>
                                <label class="slds-form-element__label" for="recordName">{recordFieldLabel} <span class="slds-text-color_error">*</span></label>
                                <lightning-input 
                                    type="text" 
                                    value={recordNameDisplay} 
                                    name="recordName"
                                    placeholder="Auto-generated..." 
                                    variant="label-hidden" 
                                    class="slds-m-top_x-small"
                                    disabled
                                    readonly>
                                </lightning-input>
                                <template if:true={isConverting}>
                                    <div class="slds-text-align_center slds-m-top_x-small">
                                        <lightning-spinner alternative-text="Generating..." size="small"></lightning-spinner>
                                        <p class="slds-text-body_small slds-m-top_x-small">Generating {recordFieldLabel}...</p>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
                -->

                <!-- COMMENTED OUT - Message for "Assigned to Dealer" leads - Not needed anymore -->
                <!--
                <template if:true={isAssignedToDealer}>
                    <div class="slds-box slds-theme_warning slds-m-vertical_small">
                        <div class="slds-text-align_center slds-p-around_small">
                            <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                            <strong>Dealer Assignment Conversion</strong>
                            <p class="slds-m-top_x-small">This lead is assigned to a dealer. Only Account and Contact records will be created.</p>
                        </div>
                    </div>
                </template>
                -->
            </div>
        </template>

        <template if:true={converted}>
            <div class="slds-box slds-theme_shade">
                <h1 class="slds-text-heading_medium slds-m-bottom_medium slds-m-top_medium slds-text-align_center">Your Lead
                    Has Been Converted
                </h1>
                <div class="slds-align_absolute-center slds-m-bottom_medium">
                    <img src={resourse} alt="Converted" style="width: 200px; height: 200px;" />
                </div>

                <!-- Center-aligned cards container -->
                <div class="slds-grid slds-wrap slds-grid_align-center slds-p-around_medium">
                    <!-- Account Card - Show if new account was created or existing account used -->
                    <div class="slds-col slds-large-size_5-of-12 slds-medium-size_6-of-12 slds-size_12-of-12 slds-p-around_small">
                        <lightning-card title="Account" icon-name="standard:account">
                            <div class="slds-card__body slds-p-around_medium" style="font-size: 16px; min-height: 150px;">
                                <p class="slds-m-bottom_small"><strong>Name:</strong> {accountData.Name}</p>
                                <p class="slds-m-bottom_small"><strong>Phone:</strong> {accountData.Phone}</p>
                                <p class="slds-m-bottom_small"><strong>Email:</strong> {accountData.Email__c}</p>
                                <template if:false={isNewAccount}>
                                    <p class="slds-m-top_small slds-text-color_success"><em>(Existing Account)</em></p>
                                </template>
                            </div>
                        </lightning-card>
                    </div>

                    <!-- Contact Card - shown whenever a Contact was created,
                         for both the new-account path and the existing-account path -->
                    <template if:true={contactData}>
                        <div class="slds-col slds-large-size_5-of-12 slds-medium-size_6-of-12 slds-size_12-of-12 slds-p-around_small">
                            <lightning-card title="Contact" icon-name="standard:contact">
                                <div class="slds-card__body slds-p-around_medium" style="font-size: 16px; min-height: 150px;">
                                    <p class="slds-m-bottom_small"><strong>Name:</strong> {contactData.Name}</p>
                                    <p class="slds-m-bottom_small"><strong>Mobile:</strong> {contactData.MobilePhone}</p>
                                    <p class="slds-m-bottom_small"><strong>Email:</strong> {contactData.Email}</p>
                                </div>
                            </lightning-card>
                        </div>
                    </template>

                    <!-- COMMENTED OUT - Sample Request / Quote Card - Not creating Quote/Sample anymore -->
                    <!--
                    <template if:false={isAssignedToDealer}>
                        <div
                            class="slds-col slds-large-size_4-of-12 slds-medium-size_6-of-12 slds-size_12-of-12 slds-p-around_small">
                            <lightning-card title={recordTypeLabel} icon-name={recordIcon}>
                                <div class="slds-card__body" style="font-size: 16px;">
                                    <p class="slds-m-left_small"><strong>Name:</strong> {recordData.Name}</p>
                                    <p class="slds-m-left_small"><strong>Account Name:</strong> {accountData.Name}</p>
                                    <p class="slds-m-left_small"><strong>Owner:</strong> {owner}</p>
                                </div>
                            </lightning-card>
                        </div>
                    </template>
                    -->
                </div>
            </div>
        </template>
    </template>

    <!-- Footer Section -->
    <footer class="footerClass">
        <div class="slds-p-around_medium slds-is-relative" style="font-size:23px;">
            <div class="slds-fixed_bottom slds-p-vertical_small slds-text-align_center slds-theme_default">
                <template if:false={isConverted}>
                    <div class="slds-grid slds-wrap slds-grid_align-center">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                            <div class="slds-grid slds-gutters_x-small">
                                <div class="slds-col slds-size_1-of-2">
                                    <button class="button-21" onclick={handleCloseClick} disabled={isConverting}>Close</button>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <button class="button-21" onclick={handleClick} disabled={isConvertDisabled}>
                                        <template if:false={isConverting}>Convert</template>
                                        <template if:true={isConverting}>Converting...</template>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
                <template if:true={converted}>
                    <lightning-button variant="brand" label="Close" onclick={handleCloseOppClick}
                        class="slds-m-right_small"></lightning-button>
                    <lightning-button variant="brand" label="Go To Record" title="Go To Record"
                        onclick={onclickGO}></lightning-button>
                </template>
            </div>
        </div>
    </footer>
</template>
